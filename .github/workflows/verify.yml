name: Release candidate checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: CHROME_BIN="$(command -v google-chrome)" node scripts/browser-check.mjs
  fedora:
    runs-on: ubuntu-latest
    container: fedora:43
    timeout-minutes: 15
    steps:
      - run: dnf install -y git nodejs npm https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm
      - uses: actions/checkout@v4
      - run: npm test
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: CHROME_BIN="$(command -v google-chrome)" node scripts/browser-check.mjs
